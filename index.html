<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Netflix Azərbaycan — tədris layihəsi</title>
  <meta name="description" content="Azərbaycan filmləri haqqında qeyri-rəsmi tədris layihəsi. Film izləmə xidməti deyil.">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e50914'/%3E%3Cpath d='M12 9.5v13l10.5-6.5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Məzmuna keç</a>

  <header class="topbar" id="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#top" aria-label="Netflix Azərbaycan — əsas səhifə">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M12.5 9.5v13l10-6.5z" fill="#fff"/></svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">Netflix</span>
          <span class="brand__sub">Azərbaycan</span>
        </span>
      </a>

      <div class="topbar__filters" id="filters">
        <label class="field field--search">
          <span class="visually-hidden">Film adına görə axtar</span>
          <svg class="field__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Film adını yazın…" autocomplete="off" spellcheck="false" enterkeyhint="search">
        </label>
        <label class="field field--select">
          <span class="visually-hidden">Janr seçimi</span>
          <select id="genre">
            <option value="">Bütün janrlar</option>
          </select>
          <svg class="field__chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </label>
      </div>

      <div class="topbar__actions">
        <button class="icon-btn filters-toggle" id="filtersToggle" type="button" aria-expanded="false" aria-controls="filters">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="visually-hidden">Axtarış və janr filtrləri</span>
        </button>
        <button class="btn btn--ghost pick-btn" id="pickBtn" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
          <span class="pick-btn__label">Mənə film seç</span>
        </button>
        <a class="mylist-link" href="#siyahim">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span class="mylist-link__label">Siyahım</span>
          <span class="badge" id="listCount" aria-label="0 film">0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="main">
    <h1 class="visually-hidden">Netflix Azərbaycan — Azərbaycan filmləri kataloqu</h1>

    <!-- Hero slayder: app.js films.js-dən doldurur -->
    <section class="hero" id="top" aria-roledescription="karusel" aria-label="Seçilmiş filmlər">
      <div class="hero__slides" id="heroSlides"></div>
      <div class="hero__dots" id="heroDots" role="group" aria-label="Slaydlar"></div>
    </section>

    <!-- Janr çipləri -->
    <nav class="chips-bar" aria-label="Janrlar üzrə filtr">
      <div class="chips" id="genreChips"></div>
    </nav>

    <!-- Bütün sıralar app.js tərəfindən yaradılır -->
    <div class="rows" id="rows"></div>
  </main>

  <footer class="footer">
    <p>Qeyri-rəsmi tədris layihəsidir, Netflix ilə əlaqəli deyil. Sayt film izləmə xidməti deyil.</p>
  </footer>

  <!-- "Mənə film seç" paneli -->
  <aside class="picker" id="picker" hidden aria-labelledby="pickerTitle">
    <div class="picker__head">
      <h2 class="picker__title" id="pickerTitle">Mənə film seç</h2>
      <button class="icon-btn icon-btn--sm" id="pickerClose" type="button" aria-label="Paneli bağla">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="picker__genre" id="pickerGenre"></p>
    <div class="picker__stage" id="pickerStage"></div>
    <p class="visually-hidden" id="pickerStatus" role="status" aria-live="polite"></p>
  </aside>

  <!-- Film pəncərəsi (modal) -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-modal-backdrop></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc" tabindex="-1">
      <button class="icon-btn modal__close" id="modalClose" type="button" aria-label="Pəncərəni bağla">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div class="modal__banner" id="modalBanner" aria-hidden="true"></div>
      <div class="modal__poster" id="modalPoster"></div>
      <div class="modal__main">
      <div class="modal__head">
        <h2 class="modal__title" id="modalTitle"></h2>
        <p class="modal__meta" id="modalMeta"></p>
      </div>
      <div class="modal__body">
        <p class="modal__desc" id="modalDesc"></p>
        <p class="modal__cinema" id="modalCinema" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16v10H4zM8 7V5m8 2V5M8 19v-2m8 2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Hazırda yalnız kinoteatrlarda nümayiş olunur
        </p>
        <p class="modal__source" id="modalSource"></p>
        <div class="modal__actions">
          <button class="btn btn--primary" id="modalTrailer" type="button" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
            <span>Treyleri izlə</span>
          </button>
          <button class="btn btn--secondary list-toggle" id="modalList" type="button"></button>
        </div>
      </div>
      </div>
      <div class="modal__video" id="modalVideo" hidden></div>
      <p class="modal__imgsrc" id="modalImageSource" hidden></p>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="films.js"></script>
  <script src="app.js"></script>
</body>
</html>
